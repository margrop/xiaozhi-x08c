name: Android CI

on:
  push:
    branches: [main, "feat/*"]
  pull_request:
    branches: [main]

jobs:
  public-tree-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for private artifacts and secrets
        run: python3 tools/check-public-tree.py

  build:
    runs-on: ubuntu-latest
    needs: public-tree-check
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          # The legacy `tools` package was removed from modern SDK repositories;
          # setup-android's default package list makes CI fail before Gradle runs.
          packages: platform-tools

      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Grant Gradle wrapper permission
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-x08c-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
